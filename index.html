<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор изделий | Grandex</title>
<style>
  body{font-family:-apple-system,Arial,sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222;padding-bottom:40px;}
  .app{max-width:600px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
  
  .logo-container {text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #edf2f7;}
  .logo-svg {max-width: 240px; width: 100%; height: auto;}
  
  h1{font-size:20px;margin:0 0 20px;text-align:center;color:#1a202c; font-weight: 600;}
  h2.section-title {font-size:16px; color:#4a8c33; margin-top:24px; margin-bottom:12px; border-bottom:1px solid #e2e8f0; padding-bottom:4px;}
  label{display:block;font-size:13px;color:#4a5568;margin:14px 0 6px;font-weight:600}
  input,select{width:100%;box-sizing:border-box;padding:12px;font-size:15px;border:1px solid #cbd5e0;border-radius:8px;background:#f7fafc;transition:0.2s; color:#2d3748;}
  input:focus, select:focus {border-color:#4a8c33; outline:none; background:#fff; box-shadow:0 0 0 3px rgba(74,140,51,0.1);}
  input:disabled {background:#e2e8f0; color:#718096; cursor:not-allowed;}
  
  .row{display:flex;gap:12px}.row>div{flex:1}
  
  .toggle-container{display:flex;align-items:center;gap:10px;margin-top:16px;background:#f7fafc;padding:12px;border-radius:8px;border:1px solid #e2e8f0;}
  .toggle-container input{width:18px; height:18px; margin:0;cursor:pointer}
  .toggle-container label{margin:0;cursor:pointer;font-size:14px; color:#2d3748; font-weight: 600;}

  /* Блок стоимости */
  .cost-box {
    background: #4a8c33; 
    border-radius: 12px;
    padding: 24px;
    text-align: center;
    margin-top: 32px;
    color: #fff;
  }
  .cost-label {
    font-size: 14px;
    color: #a0aec0;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .cost-value {
    font-size: 36px;
    font-weight: 800;
    color: #fff;
  }
  
  /* Блок менеджера */
  .manager-info {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #4a5568;
    line-height: 1.6;
  }
  .manager-info strong {
    color: #1a202c;
  }
  .manager-phone {
    color: #c53030; 
    font-weight: bold;
    text-decoration: none;
    font-size: 16px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="logo-container">
    <img src="logo.jpg" class="logo-svg" alt="Grandex">
  </div>
  <h1>Калькулятор изделий</h1>
  <h2 class="section-title">Параметры изделия</h2>
  
  <label>Тип изделия</label>
  <select id="productType" onchange="updateUI()">
    <option value="kitchen">Кухонная столешница</option>
    <option value="bath">Столешница в ванную</option>
    <option value="sill">Подоконник</option>
  </select>
  
  <div id="shapeBlock">
    <label>Форма</label>
    <select id="shape" onchange="updateShapeFields()">
      <option value="straight">Прямая</option>
      <option value="l">Угловая (Г-образная)</option>
      <option value="u">П-образная</option>
    </select>
  </div>
  
  <div class="row">
    <div id="div_len1"><label id="lbl_len1">Длина, мм</label><input id="len1" type="number" value="3000" min="0"></div>
    <div id="div_len2" style="display:none"><label>Крыло 2, мм</label><input id="len2" type="number" value="1500" min="0"></div>
    <div id="div_len3" style="display:none"><label>Крыло 3, мм</label><input id="len3" type="number" value="1500" min="0"></div>
  </div>
  
  <div>
    <label>Ширина, мм</label>
    <input id="width" type="number" value="600" min="100">
  </div>

  <div class="row">
    <div><label>Серия камня</label>
      <select id="series">
        <option value="P104">Grandex P104 (Белый однотонный)</option>
        <option value="P">Grandex P (Однотонные камни)</option>
        <option value="S">Grandex S/D (Крошка)</option>
        <option value="A">Grandex A (Крупная крошка)</option>
        <option value="EMC">Grandex E/M/C (С разводами)</option>
      </select>
    </div>
    <div id="bortikBlock"><label>Бортик, п.м.</label><input id="bortik" type="number" value="0" min="0" step="0.1"></div>
  </div>

  <div id="sinkBlock">
    <label>Мойка / Раковина</label>
    <select id="sink" onchange="toggleDisposal()"></select>
  </div>
  
  <div id="disposalBlock" style="display:none;">
    <label>Усиление под измельчитель</label>
    <select id="disposal"><option value="no">Нет</option><option value="yes">Да</option></select>
  </div>

  <div class="row" id="hobBlock">
    <div>
      <label>Вырез варочной</label>
      <select id="hob">
        <option value="no">Нет</option>
        <option value="large">Да (3-4 конфорки)</option>
        <option value="small">Да (2 конфорки)</option>
      </select>
    </div>
    <div><label>Вырез смесителя</label><input type="text" value="Бесплатно" disabled></div>
  </div>

  <div id="panelToggleBlock">
    <div class="toggle-container">
      <input type="checkbox" id="hasPanel" onchange="togglePanelDisplay()">
      <label for="hasPanel">Добавить стеновую панель</label>
    </div>
    <div id="panelBlock" style="display:none; padding-left: 12px; border-left: 3px solid #4a8c33; margin-top: 12px;">
      <label>Тип панели</label>
      <select id="panelType">
        <option value="attached">Приставная</option>
        <option value="integrated">Интегрированная (с плинтусом)</option>
      </select>
      <div class="row">
        <div><label>Длина панели, мм</label><input id="panelLen" type="number" value="3000" min="0"></div>
        <div><label>Ширина панели, мм</label><input id="panelWidth" type="number" value="600" min="100"></div>
      </div>
      <div class="row">
        <div><label>Розетки, шт</label><input id="sockets" type="number" value="0" min="0"></div>
      </div>
    </div>
  </div>

  <!-- Блок с итоговой стоимостью -->
  <div class="cost-box">
    <div class="cost-label">Примерная стоимость:</div>
    <div class="cost-value" id="totalPrice">0 ₽</div>
  </div>

  <!-- Блок с менеджером (обновленный номер) -->
  <div class="manager-info">
    Ваш менеджер: <strong>Сергей</strong><br>
    Телефон: <a href="tel:+79612150101" class="manager-phone">+7 (961) 215-01-01</a>
  </div>

</div>

<script>
// Курс
let currentRate = 90; 
async function fetchCBRRate() {
    try {
        const response = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
        if (!response.ok) throw new Error('Ошибка сети');
        const data = await response.json();
        currentRate = Math.round(data.Valute.USD.Value * 1.08 * 100) / 100;
        calculate(); 
    } catch (error) {
        console.error('Ошибка загрузки курса, используется резервный 90 ₽:', error);
    }
}
fetchCBRRate();

// Данные (Base64)
const b64 = {
    prices: "eyJQMTA0IjoyODUsIlAiOjM2MCwiUyI6NDAwLCJBIjo0MjAsIkVNQyI6NTc1fQ==", 
    mult: "eyJQMTA0IjowLjI1LCJQIjowLjI1LCJTIjowLjI1LCJBIjowLjI1LCJFTUMiOjAuNX0=",   
    workM2: "OTAwMA==", bortik: "MTAwMA==", hob: "MTUwMA==",    
    sinkUnder: "MzAwMA==", sinkInset: "MTUwMA==", sinkStd: "MTEwMDA=", sinkK: "MTI1MDA=",
    bathOval: "ODAwMA==", bathBoat: "OTUwMA==", bathSlot: "MTYwMDA=",
    seam: "MzAwMA==", glueTube: "MjAwMA==", gluePerM: "Mw==", delivery: "OTAwMA==", mountPct: "MC4yMA==",
    panelAttachedWork: "NzAwMA==", panelIntWork: "OTAwMA==", socketAttached: "NTAw", socketInt: "MTAwMA==", plinth: "MjIwMA==", panelSeam: "MzUwMA==",
    sillWork: "OTAwMA==", sillMontage: "MTUwMA==",
    disposal: "MzAwMA==", minOrder: "MzAwMA=="
};
const PRICES = JSON.parse(atob(b64.prices)), MULT = JSON.parse(atob(b64.mult));
const WORK_M2 = +atob(b64.workM2), BORTIK = +atob(b64.bortik), HOB = +atob(b64.hob);
const S_UNDER = +atob(b64.sinkUnder), S_INSET = +atob(b64.sinkInset), S_STD = +atob(b64.sinkStd), S_K = +atob(b64.sinkK);
const BATH_OVAL = +atob(b64.bathOval), BATH_BOAT = +atob(b64.bathBoat), BATH_SLOT = +atob(b64.bathSlot);
const SEAM = +atob(b64.seam), GLUE_T = +atob(b64.glueTube), GLUE_M = +atob(b64.gluePerM), DELIV = +atob(b64.delivery);
const MOUNT_PCT = +atob(b64.mountPct);
const P_ATT_W = +atob(b64.panelAttachedWork), P_INT_W = +atob(b64.panelIntWork);
const SOCK_ATT = +atob(b64.socketAttached), SOCK_INT = +atob(b64.socketInt);
const PLINTH = +atob(b64.plinth), P_SEAM = +atob(b64.panelSeam);
const SILL_W = +atob(b64.sillWork), SILL_M = +atob(b64.sillMontage);
const DISPOSAL = +atob(b64.disposal), MIN_ORDER = +atob(b64.minOrder);
const SHEET_L = 3680;

const fmt = n => n.toLocaleString('ru-RU', {maximumFractionDigits: 0}) + ' ₽';

function togglePanelDisplay() {
    document.getElementById('panelBlock').style.display = document.getElementById('hasPanel').checked ? 'block' : 'none';
    calculate();
}
function toggleDisposal() {
    const sink = document.getElementById('sink').value;
    document.getElementById('disposalBlock').style.display = sink.includes('integrated') ? 'block' : 'none';
    calculate();
}
function updateUI() {
    const type = document.getElementById('productType').value;
    document.getElementById('shapeBlock').style.display = type === 'sill' ? 'none' : 'block';
    document.getElementById('sinkBlock').style.display = type === 'sill' ? 'none' : 'block';
    document.getElementById('hobBlock').style.display = type === 'kitchen' ? 'flex' : 'none';
    document.getElementById('bortikBlock').style.display = type === 'sill' ? 'none' : 'block';
    document.getElementById('panelToggleBlock').style.display = type === 'sill' ? 'none' : 'block';
    if (type === 'sill') {
        document.getElementById('shape').value = 'straight';
        document.getElementById('lbl_len1').innerText = 'Длина подоконника, мм';
        document.getElementById('len1').value = 1500;
        document.getElementById('width').value = 300;
    } else {
        document.getElementById('lbl_len1').innerText = 'Длина, мм';
        document.getElementById('len1').value = 3000;
        document.getElementById('width').value = 600;
    }
    const sinkSelect = document.getElementById('sink');
    sinkSelect.innerHTML = '';
    if (type === 'kitchen') {
        sinkSelect.innerHTML = `
            <option value="none">Нет</option>
            <option value="under">Подстольная</option>
            <option value="inset">Врезная</option>
            <option value="integrated_std">Интегрированная стандарт</option>
            <option value="integrated_k">Интегрированная модель K</option>`;
    } else if (type === 'bath') {
        sinkSelect.innerHTML = `
            <option value="none">Нет</option>
            <option value="under">Подстольная</option>
            <option value="inset">Врезная</option>
            <option value="integrated_std">Интегрированная стандарт</option>
            <option value="integrated_k">Интегрированная модель K</option>
            <option value="bath_oval">Раковина Овальная</option>
            <option value="bath_boat">Раковина Лодочка</option>
            <option value="bath_slot">Раковина Щелевая</option>`;
    }
    toggleDisposal();
    updateShapeFields();
    calculate(); 
}
function updateShapeFields() {
    const shape = document.getElementById('shape').value;
    document.getElementById('div_len2').style.display = (shape === 'l' || shape === 'u') ? 'block' : 'none';
    document.getElementById('div_len3').style.display = (shape === 'u') ? 'block' : 'none';
    const lblLen1 = document.getElementById('lbl_len1');
    if(shape === 'straight') lblLen1.innerText = 'Длина, мм';
    if(shape === 'l') lblLen1.innerText = 'Длина 1 (основная), мм';
    if(shape === 'u') lblLen1.innerText = 'Длина 1 (основная), мм';
    calculate();
}

// ГЛАВНАЯ ФУНКЦИЯ РАСЧЕТА
function calculate() {
    const val = (id) => { let v = parseFloat(document.getElementById(id).value); return isNaN(v) ? 0 : v; };
    
    const type = document.getElementById('productType').value;
    const shape = document.getElementById('shape').value;
    const len1 = val('len1');
    const len2 = document.getElementById('div_len2').style.display === 'block' ? val('len2') : 0;
    const len3 = document.getElementById('div_len3').style.display === 'block' ? val('len3') : 0;
    const width = val('width');
    
    if (len1 === 0 || width === 0) {
        document.getElementById('totalPrice').innerText = '0 ₽';
        return;
    }

    const series = document.getElementById('series').value;
    const sink = type !== 'sill' ? document.getElementById('sink').value : 'none';
    const hob = type === 'kitchen' ? document.getElementById('hob').value : 'no';
    const bortik = type !== 'sill' ? val('bortik') : 0;
    const disposal = document.getElementById('disposal').value;
    const rate = currentRate; 

    const hasPanel = type !== 'sill' ? document.getElementById('hasPanel').checked : false;
    const panelType = document.getElementById('panelType').value;
    const panelLen = hasPanel ? val('panelLen') : 0;
    const panelWidth = hasPanel ? val('panelWidth') : 0;
    const sockets = hasPanel ? val('sockets') : 0;

    let itemLength = 0;
    if (type === 'sill') itemLength = len1;
    else if (shape === 'straight') itemLength = len1;
    else if (shape === 'l') itemLength = len1 + Math.max(0, len2 - width);
    else if (shape === 'u') itemLength = len1 + Math.max(0, len2 - width) + Math.max(0, len3 - width);

    const itemAreaM2 = (itemLength / 1000) * (width / 1000);
    const panelAreaM2 = hasPanel ? (panelLen / 1000) * (panelWidth / 1000) : 0;
    const totalArea = itemAreaM2 + panelAreaM2;

    let itemSheets = 0;
    let tableLeftoverLength = 0;

    if (itemLength > 0) {
        if (type === 'sill' && width <= 320) {
            itemSheets = Math.ceil(itemLength / 1840) * 0.25;
        } else {
            const quarterUnits = Math.ceil(itemLength / 920);
            itemSheets = quarterUnits * 0.25;
            tableLeftoverLength = quarterUnits * 920 - itemLength;
        }
    }

    let panelSheets = 0;
    if (hasPanel && panelLen > 0) {
        panelSheets = Math.ceil(panelLen / 920) * 0.25;
    }

    let sinkSheetAdd = 0;
    const isIntegrated = (sink === 'integrated_std' || sink === 'integrated_k');
    const isBathIntegrated = (sink === 'bath_boat' || sink === 'bath_slot');

    if (isIntegrated || isBathIntegrated) {
        if (hob === 'large' && isIntegrated && tableLeftoverLength >= 500) {
            sinkSheetAdd = 0;
        } else {
            sinkSheetAdd = 0.25;
        }
    }
    if (sink === 'bath_oval') sinkSheetAdd = 0.5;

    const baseSheets = itemSheets + panelSheets + sinkSheetAdd;
    const sheets = Math.ceil(baseSheets / MULT[series]) * MULT[series];
    
    const sheetPrice = PRICES[series] * rate; 
    const materialCost = sheets * sheetPrice;

    let itemWorks = itemAreaM2 * WORK_M2;
    if (type === 'sill') {
        itemWorks += (itemLength / 1000) * SILL_M;
    } else {
        itemWorks += bortik * BORTIK;
        if (hob !== 'no') itemWorks += HOB;
        if (sink === 'under') itemWorks += S_UNDER;
        if (sink === 'inset') itemWorks += S_INSET;
        if (sink === 'integrated_std') itemWorks += S_STD;
        if (sink === 'integrated_k') itemWorks += S_K;
        if (sink === 'bath_oval') itemWorks += BATH_OVAL;
        if (sink === 'bath_boat') itemWorks += BATH_BOAT;
        if (sink === 'bath_slot') itemWorks += BATH_SLOT;
        if (sink.includes('integrated') && disposal === 'yes') itemWorks += DISPOSAL;
        let tableSeams = 0;
        if (len1 >= 3000) tableSeams++;
        if (shape !== 'straight' && len2 >= 3000) tableSeams++;
        if (shape === 'u' && len3 >= 3000) tableSeams++;
        itemWorks += tableSeams * SEAM;
    }
    let panelWorks = 0;
    if (hasPanel) {
        panelWorks += panelAreaM2 * (panelType === 'attached' ? P_ATT_W : P_INT_W);
        panelWorks += sockets * (panelType === 'attached' ? SOCK_ATT : SOCK_INT);
        if (panelType === 'integrated') panelWorks += (panelLen / 1000) * PLINTH;
        if (panelLen >= 3000) panelWorks += P_SEAM;
    }
    const totalWorks = itemWorks + panelWorks;
    const mounting = totalWorks * MOUNT_PCT;

    let tubes = 0;
    if (itemLength > 0) tubes += Math.ceil(itemLength / 1000 / GLUE_M);
    if (isIntegrated || isBathIntegrated) tubes += 2;
    if (sink === 'bath_oval') tubes += 0.5;
    if (hasPanel && panelType === 'integrated') tubes += Math.ceil(panelLen / 1000 / GLUE_M);
    tubes = Math.ceil(tubes);
    const glueCost = tubes * GLUE_T;

    const minOrderCost = totalArea < 1.5 ? MIN_ORDER : 0;
    const total = materialCost + glueCost + totalWorks + mounting + DELIV + minOrderCost;

    document.getElementById('totalPrice').innerText = fmt(total);
}

document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', calculate);
    el.addEventListener('change', calculate);
});

updateUI();
calculate();
</script>
</body>
</html>
